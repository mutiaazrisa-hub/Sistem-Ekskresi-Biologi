<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebAR Sistem Ekskresi Manusia</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#e6edf3;font:14px system-ui,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh}
header{display:flex;gap:10px;align-items:center;padding:6px 10px;background:#161b22}
header b{white-space:nowrap}nav{display:flex;gap:6px;overflow-x:auto}
button{background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:6px 10px;cursor:pointer;white-space:nowrap}
button.on{background:#1f6feb;border-color:#58a6ff}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;background:radial-gradient(#1b2735,#0d1117);min-width:0}
canvas{width:100%;height:100%;display:block;touch-action:none}
#ln,#lbls{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
#ln line{stroke:#fff9;stroke-width:1}
.lbl{position:absolute;left:0;top:0;font-size:12px;background:#000b;padding:2px 6px;border-radius:4px;white-space:nowrap}
#load,#err{position:absolute;left:10px;top:10px;right:10px;background:#000c;padding:8px;border-radius:6px}
#err{background:#8b1a1a}
aside{width:340px;padding:10px;overflow:auto;background:#161b22;display:flex;flex-direction:column;gap:8px}
aside h2{margin:0;font-size:17px}aside p{margin:0;line-height:1.5}#inf{color:#7ee787}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
footer{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:6px 10px;background:#161b22}
footer label,aside label{display:flex;gap:4px;align-items:center;font-size:12px}
#bmv{display:none}.ar #bmv{display:inline-block}
.ar,.ar #app,.ar #stage{background:transparent!important}.ar canvas{background:transparent}
#note{font-size:11px;color:#8b949e}
@media(max-width:800px){main{flex-direction:column}aside{width:100%;max-height:40%}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="app">
<header><b>🫘 WebAR Sistem Ekskresi</b><nav id="nav"></nav></header>
<main>
<div id="stage"><canvas id="c"></canvas><svg id="ln"></svg><div id="lbls"></div>
<div id="load">Memuat pustaka 3D…</div><div id="err" hidden></div></div>
<aside>
<h2 id="t"></h2><p id="tx"></p><div class="row" id="stg"></div><p id="inf">Klik bagian organ pada model untuk melihat keterangannya.</p>
<div class="row"><button id="ba">🔊 Narasi otomatis: mati</button></div>
<div class="row"><button id="n1">▶ Putar</button><button id="n2">⏯ Jeda/Lanjut</button><button id="n3">↻ Ulangi</button>
<label>Volume <input id="vol" type="range" min="0" max="1" step=".1" value=".9"></label></div>
<p id="note">Model dibuat prosedural (skematis, bukan hasil pindai medis). Narasi memakai suara sintetis peramban (Web Speech API); efek suara dibuat sintetis, bukan rekaman biologis.</p>
<p id="arinfo" class="note"></p>
</aside></main>
<footer>
<button id="bp">⏸ Jeda animasi</button><button id="br">↻ Ulang animasi</button>
<label>Kecepatan <input id="sp" type="range" min=".25" max="3" step=".25" value="1"></label>
<label>Transparansi <input id="tr" type="range" min=".05" max="1" step=".05" value=".5"></label>
<button id="bl" class="on">Label</button><button id="bs">Penampang</button><button id="bx">Bongkar</button>
<button id="bz1">−</button><button id="bz2">＋</button><button id="bar">Lihat dalam AR</button><button id="bmv">Geser (AR)</button>
</footer></div>
